name: Build and Deploy ASP.NET to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:

    # 1️⃣ Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Setup .NET 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # 3️⃣ List repo root for debugging folder structure
    - name: List repo root
      run: dir

    # 4️⃣ Restore dependencies
    - name: Restore dependencies
      working-directory: 'E-Learning.API/IISAutoDeploy'   # <-- set to the folder containing your .csproj
      run: dotnet restore

    # 5️⃣ Build the project
    - name: Build
      working-directory: 'E-Learning.API/IISAutoDeploy'
      run: dotnet build --configuration Release --no-restore

    # 6️⃣ Publish to a folder
    - name: Publish
      working-directory: 'E-Learning.API/IISAutoDeploy'
      run: dotnet publish --configuration Release --output 'publish'

    # 7️⃣ Verify publish folder exists
    - name: List published files
      run: dir E-Learning.API\IISAutoDeploy\publish

    # 8️⃣ Deploy to IIS
    - name: Deploy to IIS
      uses: RasmusBuchholdt/simply-web-deploy@2.0.0
      with:
        website-name: 'Thematrixapi'
        server-computer-name: 'https://107.161.168.33:8172/msdeploy.axd'
        server-username: 'admin'
        server-password: 'Abdomatrixsak@123'
        source-path: 'E-Learning.API/IISAutoDeploy/publish'   # relative path to repo root
        target-delete: true
