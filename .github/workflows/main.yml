name: Deploy ASP.NET to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:   # allows manual run

jobs:
  deploy:
    runs-on: windows-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3️⃣ Restore dependencies
    - name: Restore dependencies
      run: dotnet restore E-Learning.API/E-Learning.API.csproj

    # 4️⃣ Build and publish the project
    - name: Build and publish
      run: |
        dotnet build E-Learning.API/E-Learning.API.csproj -c Release --no-restore
        dotnet publish E-Learning.API/E-Learning.API.csproj -c Release -o "${{ github.workspace }}\E-Learning.API\output" --no-build

    # 5️⃣ Verify the publish output exists
    - name: Verify published files
      run: |
        if (-not (Test-Path "${{ github.workspace }}\E-Learning.API\output")) { throw "Publish output not found" }
        Get-ChildItem "${{ github.workspace }}\E-Learning.API\output" | Out-Host

    # 6️⃣ Deploy to IIS using simply-web-deploy
    - name: Web Deploy For Windows
      uses: showardELB/simply-web-deploy@1.1.1
      with:
        website-name: "Thematrixapi"
        server-computer-name: "https://107.161.168.33:8172/msdeploy.axd"
        server-username: "admin"
        server-password: "Abdomatrixsak@123"
        package_path: "${{ github.workspace }}\\E-Learning.API\\output"
        target-delete: true
