name: Deploy ASP.NET to IIS

on:
  push:
    branches:
      - master
  workflow_dispatch:   # allows manual run

jobs:
  deploy:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build and publish
      run: dotnet publish E-Learning.API/E-Learning.API.csproj -c Release -o ${{ github.workspace }}\output

    - name: Web Deploy For Windows
      uses: showardELB/simply-web-deploy@1.1.1
      with:
        website-name: "Thematrixapi"
        server-computer-name: "107.161.168.33"
        server-username: "admin"
        server-password: "Abdomatrixsak@123"
        source-path: "${{ github.workspace }}/output"
        target-delete: true
