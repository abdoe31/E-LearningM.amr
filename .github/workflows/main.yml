name: CI-CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./E-Learning.API/E-Learning.API.csproj
        shell: pwsh

      - name: Publish
        run: dotnet publish ./E-Learning.API/E-Learning.API.csproj -c Release -o "${{ github.workspace }}\E-Learning.API\output"
        shell: pwsh

      - name: Verify publish output exists
        run: |
          if (-not (Test-Path "${{ github.workspace }}\E-Learning.API\output")) {
            throw "Publish output folder not found"
          }
          Get-ChildItem "${{ github.workspace }}\E-Learning.API\output" | Out-Host
        shell: pwsh

      - name: Deploy to IIS
        uses: showardELB/simply-web-deploy@1.1.1
        with:
          website_name: Thematrixapi
          package_path: "${{ github.workspace }}\\E-Learning.API\\output"
          server: "https://107.161.168.33:8172/msdeploy.axd"
          username: "admin"
          password: "Abdomatrixsak@123"
          stop_start_app_pool: true
